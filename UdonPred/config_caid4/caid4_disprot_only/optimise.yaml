fp16:
  type: categorical
  values:
  - false
learning_rate:
  type: float
  values:
  - 0.0001
  - 0.01
batch_size:
  type: int
  values:
  - 1
  - 128
lr_scheduler:
  type: categorical
  values:
  - cosine
  - reduce_lr_on_plateau
  - constant
num_layers:
  type: int
  values:
  - 1
  - 3
layer_type:
  type: categorical
  values:
  - torch.nn.Linear
  - model.layers.CNNLayer
layer_size:
  type: int
  values:
  - 4
  - 2048
layer_params:
  torch.nn.Linear: {}
  model.layers.CNNLayer:
    kernel_size:
      type: categorical
      values:
      - 3
      - 5
      - 7
      - 9
      - 15
      - 21
activation_type:
  type: categorical
  values:
  - torch.nn.LeakyReLU
  - torch.nn.ReLU
  - torch.nn.Tanh
  - null
dropout_rate:
  type: float
  values:
  - 0.0
  - 1.0
lora:
  finetune:
    type: bool
    values:
    - false
  r:
    type: int
    values:
    - 4
    - 16
  lora_alpha:
    type: int
    values:
    - 1
    - 16
  lora_dropout:
    type: float
    values:
    - 0.0
    - 1.0
